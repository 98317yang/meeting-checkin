<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>會議簽到系統</title><link rel="stylesheet" href="app.css?v=20261119-liff2"></head><body><div id="shell"></div><main class="main"><div class="page-title"><h1 id="welcome">您好</h1><p id="todaySummary">歡迎使用會議簽到系統。</p></div><section class="feature-grid three-up"><a class="feature-card" href="sign-in.html"><div><div class="icon-box">▣</div><h2>今日會議</h2><p>查看今天的會議，開啟 QR Code 讓與會者簽到。</p></div><span class="arrow">前往今日會議 →</span></a><a class="feature-card" href="create-meeting.html"><div><div class="icon-box">＋</div><h2>發起會議</h2><p>設定會議資訊、主持人、地點與參與人員。</p></div><span class="arrow">建立會議 →</span></a><a class="feature-card" href="my-meetings.html"><div><div class="icon-box">⌕</div><h2>我的會議</h2><p>查看即將舉行與已結束的會議，管理 QR Code 與簽到名單。</p></div><span class="arrow">查看我的會議 →</span></a></section></main><script src="app.js?v=20261119-liff2"></script><script>initShell();document.querySelector('#welcome').textContent=`您好，${getUser().name||'使用者'}`;(async()=>{try{const today=localDateString(),q=new URLSearchParams({startDate:today,endDate:today});const list=await apiJson('api/meetings?'+q);const left=list.filter(m=>meetingAccessState(m)!=='closed').length;todaySummary.textContent=list.length?`今天有 ${list.length} 場您主持的會議${left?`，其中 ${left} 場尚未結束`:''}。`:'今天沒有您主持的會議。'}catch{}})()</script></body></html>

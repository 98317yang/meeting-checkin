<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>會議簽到名單</title>
    <link rel="stylesheet" href="css/app.css?v=20261122" />
    <style>
      .app-main {
        width: min(1600px, calc(100% - 28px));
        margin: 22px auto 44px;
      }
      .attendance-report {
        background: #fff;
        padding: 24px;
        border-radius: 16px;
        font-family: 'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif;
        overflow: hidden;
      }
      .report-heading {
        text-align: center;
        margin-bottom: 14px;
      }
      .report-heading h1,
      .report-heading h2,
      .report-heading h3 {
        margin: 3px 0;
      }
      .hospital-full-name {
        font-size: 1.35rem;
        font-weight: 800;
        line-height: 1.3;
      }
      .report-heading h1 {
        font-size: 2rem;
        line-height: 1.2;
      }
      .report-heading h3 {
        font-size: 1.55rem;
        line-height: 1.2;
      }
      .report-info {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        margin: 14px 0;
        font-size: 0.95rem;
        white-space: nowrap;
      }
      .report-info > div {
        min-width: 0;
      }
      .report-info .hosts {
        flex: 1;
        text-align: center;
      }
      .report-stats {
        display: flex;
        justify-content: center;
        gap: 36px;
        margin: 14px 0 0;
        padding: 9px 12px 0;
        border-top: 1.5px solid #111;
        font-weight: 700;
      }
      .person-main {
        font-weight: 700;
      }
      .table-wrap {
        width: 100%;
        overflow-x: auto;
        border: 1px solid #111;
        border-radius: 10px;
      }
      .attendance-table {
        width: 100%;
        min-width: 1380px;
        table-layout: fixed;
        border-collapse: collapse;
        border: 0;
      }
      .attendance-table th,
      .attendance-table td {
        height: 52px;
        padding: 6px;
        border: 1px solid #777;
        vertical-align: middle;
        text-align: center;
        word-break: break-word;
        overflow-wrap: anywhere;
        font-size: 13px;
      }
      .attendance-table th {
        height: 42px;
        background: #ededed;
        font-weight: 700;
        white-space: normal;
      }
      .attendance-table input,
      .attendance-table select {
        width: 100%;
        height: 36px;
        min-height: 36px;
        min-width: 0;
        padding: 4px 8px;
        border: 1px solid #d8ceca;
        border-radius: 7px;
        background: #fff;
        font-size: 13px;
      }
      .attendance-table .readonly {
        background: #faf9f8;
      }
      .time-picker-inline {
        display: grid;
        grid-template-columns: minmax(44px, 1fr) 10px minmax(44px, 1fr);
        align-items: center;
        gap: 3px;
      }
      .time-picker-inline select {
        width: 100%;
        min-width: 0;
        text-align: center;
        padding: 3px 2px;
      }
      .time-picker-inline .time-colon {
        font-weight: 700;
      }
      .print-time,
      .print-cell-value {
        display: none;
      }
      .attendance-table th:nth-child(1),
      .attendance-table td:nth-child(1) {
        width: 10%;
      }
      .attendance-table th:nth-child(2),
      .attendance-table td:nth-child(2) {
        width: 10%;
      }
      .attendance-table th:nth-child(3),
      .attendance-table td:nth-child(3) {
        width: 15%;
      }
      .attendance-table th:nth-child(4),
      .attendance-table td:nth-child(4) {
        width: 16%;
      }
      .attendance-table th:nth-child(5),
      .attendance-table td:nth-child(5) {
        width: 12%;
      }
      .attendance-table th:nth-child(6),
      .attendance-table td:nth-child(6) {
        width: 11%;
      }
      .attendance-table th:nth-child(7),
      .attendance-table td:nth-child(7) {
        width: 13%;
      }
      .attendance-table th:nth-child(8),
      .attendance-table td:nth-child(8) {
        width: 15%;
      }
      .attendance-table th:nth-child(9),
      .attendance-table td:nth-child(9) {
        width: 8%;
      }
      .page-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .page-actions-top {
        margin: 0 0 18px;
        justify-content: flex-end;
      }
      .page-actions-top #back {
        margin-right: auto;
        order: -1;
      }
      .time-input-inline {
        width: 100%;
        min-width: 92px;
        padding: 3px 4px;
      }
      .page-actions .btn {
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      @page {
        size: A4 portrait;
        margin: 7mm;
      }
      @media print {
        html,
        body {
          width: 100% !important;
          height: auto !important;
          min-height: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
          background: #fff !important;
          overflow: visible !important;
          font-family: 'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif !important;
        }
        #shell,
        .page-actions,
        .btn,
        .toast,
        .system-dialog-backdrop {
          display: none !important;
        }
        .app-main {
          display: block !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
        }
        .attendance-report {
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          border-radius: 0 !important;
          overflow: visible !important;
        }
        .report-heading {
          margin: 0 0 5px !important;
        }
        .hospital-full-name {
          font-size: 14px !important;
          white-space: nowrap;
        }
        .report-heading h1 {
          font-size: 21px !important;
          margin: 2px 0 !important;
        }
        .report-heading h3 {
          font-size: 16px !important;
          margin: 1px 0 !important;
        }
        .report-info {
          grid-template-columns: 1fr 1fr !important;
          gap: 3px 10px !important;
          margin: 5px 0 !important;
          font-size: 8px !important;
        }
        .table-wrap {
          width: 100% !important;
          overflow: visible !important;
          border: 0 !important;
          border-radius: 0 !important;
        }
        .attendance-table {
          width: 100% !important;
          min-width: 0 !important;
          table-layout: fixed !important;
          border-collapse: collapse !important;
          border: 1.2px solid #000 !important;
        }
        .attendance-table thead {
          display: table-header-group !important;
        }
        .attendance-table tr {
          page-break-inside: avoid !important;
        }
        .attendance-table th,
        .attendance-table td {
          height: 22px !important;
          min-height: 22px !important;
          font-size: 6.5px !important;
          line-height: 1.15 !important;
          padding: 2px 1px !important;
          border: 1px solid #000 !important;
          text-align: center !important;
          vertical-align: middle !important;
        }
        .attendance-table th {
          height: 24px !important;
          background: #ededed !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        .attendance-table input,
        .attendance-table select,
        .time-picker-inline {
          display: none !important;
        }
        .print-time,
        .print-cell-value {
          display: inline !important;
          font-size: 6.5px !important;
          line-height: 1.15 !important;
        }
        .attendance-table th:nth-child(1),
        .attendance-table td:nth-child(1) {
          width: 9% !important;
        }
        .attendance-table th:nth-child(2),
        .attendance-table td:nth-child(2) {
          width: 9% !important;
        }
        .attendance-table th:nth-child(3),
        .attendance-table td:nth-child(3) {
          width: 14% !important;
        }
        .attendance-table th:nth-child(4),
        .attendance-table td:nth-child(4) {
          width: 15% !important;
        }
        .attendance-table th:nth-child(5),
        .attendance-table td:nth-child(5) {
          width: 12% !important;
        }
        .attendance-table th:nth-child(6),
        .attendance-table td:nth-child(6) {
          width: 9% !important;
        }
        .attendance-table th:nth-child(7),
        .attendance-table td:nth-child(7) {
          width: 12% !important;
        }
        .attendance-table th:nth-child(8),
        .attendance-table td:nth-child(8) {
          width: 13% !important;
        }
        .attendance-table th:nth-child(9),
        .attendance-table td:nth-child(9) {
          width: 7% !important;
        }
        .report-stats {
          gap: 24px !important;
          margin: 6px 0 0 !important;
          padding: 5px 8px 0 !important;
          font-size: 8px !important;
          page-break-inside: avoid !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="shell"></div>
    <main class="app-main">
      <section class="attendance-report">
        <div class="page-actions page-actions-top">
          <button class="btn btn-primary" id="save" type="button">儲存</button>
          <button class="btn btn-outline" id="excel" type="button">下載 Excel</button>
          <button class="btn btn-outline" id="pdf" type="button">列印／另存 PDF</button>
          <a class="btn btn-light" id="back">返回</a>
        </div>
        <div class="report-heading">
          <h2 class="hospital-full-name">示範醫院</h2>
          <h1 id="title">會議簽到單</h1>
          <h3 id="subTitle"></h3>
        </div>
        <div class="report-info">
          <div><b>時間：</b><span id="meetingTime">—</span></div>
          <div class="hosts"><b>主持人：</b><span id="meetingHosts">—</span></div>
          <div><b>地點：</b><span id="meetingLocation">—</span></div>
        </div>
        <div class="table-wrap">
          <table class="data-table attendance-table">
            <thead>
              <tr>
                <th>簽到時間</th>
                <th>簽退時間</th>
                <th>單位</th>
                <th>姓名（員工編號）</th>
                <th>職稱</th>
                <th>出席狀況</th>
                <th>代理人單位</th>
                <th>代理人姓名（員工編號）</th>
                <th>未出席原因</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="report-stats">
          <span id="expectedStat">應到人數：<b id="expected">0</b></span>
          <span>實到人數：<b id="actual">0</b></span>
          <span id="rateStat">出席率：<b id="rate">0%</b></span>
          <span id="openStat" hidden>開放非名單人員加入，不計算出席率</span>
        </div>
      </section>
    </main>
    <script src="js/app.js?v=20261122"></script>
    <script src="js/attendance.js?v=20261122"></script>
  </body>
</html>

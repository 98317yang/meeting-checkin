<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#b51f2a" />
    <title>手機簽到｜會議簽到系統</title>
    <link rel="stylesheet" href="css/app.css?v=20261122" />

    <style>
      .mobile-topbar-user {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }
      .mobile-topbar-user > img {
        flex: 0 1 auto;
        min-width: 0;
      }
      .mobile-top-user {
        margin-left: auto;
        min-width: 0;
        max-width: 48%;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        text-align: right;
        line-height: 1.25;
      }
      .mobile-top-user-dept {
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        color: #766f6b;
      }
      .mobile-top-user-name {
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-top: 2px;
        font-size: 16px;
        color: #231f20;
        font-weight: 800;
      }
      .mobile-top-user-meta {
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-top: 2px;
        font-size: 11px;
        color: #8a817d;
      }
      @media (max-width: 390px) {
        .mobile-top-user {
          max-width: 46%;
        }
        .mobile-top-user-dept {
          font-size: 11px;
        }
        .mobile-top-user-name {
          font-size: 15px;
        }
        .mobile-top-user-meta {
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body class="mobile-page">
    <main class="mobile-shell compact-mobile-shell">
      <header class="mobile-topbar mobile-topbar-user">
        <img src="assets/logo.svg" alt="示範醫院" />
        <div id="mobileTopUser" class="mobile-top-user" aria-label="登入者資訊">
          <span class="mobile-top-user-dept">讀取中</span>
          <strong class="mobile-top-user-name">使用者</strong>
          <small class="mobile-top-user-meta">員工編號讀取中</small>
        </div>
      </header>
      <section id="mobileContent" aria-live="polite">
        <div class="mobile-loading">正在載入會議資料…</div>
      </section>
    </main>

    <script src="js/app.js?v=20261122"></script>
    <script src="js/mobile-checkin.js?v=20261122"></script>
  </body>
</html>

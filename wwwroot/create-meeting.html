<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title id="documentTitle">發起會議</title>
    <link rel="stylesheet" href="css/app.css?v=20261122" />
    <style>
      .participant-check-item.is-added {
        opacity: 0.55;
      }
      .participant-picker.participant-picker-multi {
        grid-template-columns: 1fr 1fr;
      }
      @media (max-width: 820px) {
        .participant-picker.participant-picker-multi {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="shell"></div>
    <main class="main">
      <div class="page-title">
        <h1 id="pageHeading">發起會議</h1>
        <p id="pageDescription">請填寫會議基本資料，並依單位選擇主持人與參與人員。</p>
      </div>

      <form id="meetingForm" class="panel">
        <div class="form-grid">
          <div class="field full">
            <label for="meetingName">會議名稱</label>
            <input id="meetingName" name="name" required placeholder="請輸入會議名稱" />
          </div>
          <div class="field full">
            <label for="meetingSubName">會議次名稱</label>
            <input
              id="meetingSubName"
              name="subName"
              placeholder="選填，例如：第 3 次會議、專案工作小組"
            />
          </div>
          <div class="field">
            <label for="meetingDate">會議日期</label>
            <input id="meetingDate" type="date" name="date" required />
          </div>
          <div class="field full">
            <label>會議地點</label>
            <div class="location-choice-inline">
              <label class="choice-option"
                ><input type="radio" name="hasLocation" value="0" checked /> 無</label
              >
              <label class="choice-option"
                ><input type="radio" name="hasLocation" value="1" /> 有</label
              >
              <select name="location" id="location" hidden>
                <option value="">請選擇地點</option>
              </select>
              <input
                id="customLocation"
                class="custom-location-input"
                type="text"
                maxlength="100"
                placeholder="請輸入會議地點"
                hidden
              />
            </div>
          </div>
          <div class="field">
            <label for="meetingStart">會議開始時間</label>
            <div class="time-input-wrap">
              <input
                id="meetingStart"
                type="text"
                name="start"
                required
                readonly
                inputmode="none"
                placeholder="請選擇時間"
                autocomplete="off"
                data-material-timepicker
                data-minute-step="5"
                data-time-title="選擇會議開始時間"
              />
              <button
                class="time-picker-trigger"
                type="button"
                data-time-target="meetingStart"
                aria-label="開啟開始時間選擇器"
              >
                ◷
              </button>
            </div>
          </div>
          <div class="field">
            <label for="meetingEnd">會議結束時間</label>
            <div class="time-input-wrap">
              <input
                id="meetingEnd"
                type="text"
                name="end"
                required
                readonly
                inputmode="none"
                placeholder="請選擇時間"
                autocomplete="off"
                data-material-timepicker
                data-minute-step="5"
                data-time-title="選擇會議結束時間"
              />
              <button
                class="time-picker-trigger"
                type="button"
                data-time-target="meetingEnd"
                aria-label="開啟結束時間選擇器"
              >
                ◷
              </button>
            </div>
          </div>
        </div>

        <hr class="section-line" />
        <h2 class="section-title">主持人</h2>
        <p class="section-help">
          主持人 1 預設為發起者，可自行修改；主持人 2、3 為選填。所有主持人會自動加入參與名單。
        </p>
        <datalist id="departmentOptions"></datalist>
        <div class="form-grid">
          <div class="field">
            <label for="host1Dept">主持人 1 單位</label
            ><input
              id="host1Dept"
              list="departmentOptions"
              autocomplete="off"
              placeholder="輸入單位代號或名稱搜尋"
            />
          </div>
          <div class="field">
            <label for="host1">主持人 1</label
            ><select id="host1" name="host1UserID" required>
              <option value="">請先選擇單位</option>
            </select>
          </div>
          <div class="field">
            <label for="host2Dept">主持人 2 單位</label
            ><input
              id="host2Dept"
              list="departmentOptions"
              autocomplete="off"
              placeholder="輸入單位代號或名稱搜尋"
            />
          </div>
          <div class="field">
            <label for="host2">主持人 2</label
            ><select id="host2" name="host2UserID">
              <option value="">不指定</option>
            </select>
          </div>
          <div class="field">
            <label for="host3Dept">主持人 3 單位</label
            ><input
              id="host3Dept"
              list="departmentOptions"
              autocomplete="off"
              placeholder="輸入單位代號或名稱搜尋"
            />
          </div>
          <div class="field">
            <label for="host3">主持人 3</label
            ><select id="host3" name="host3UserID">
              <option value="">不指定</option>
            </select>
          </div>
        </div>

        <hr class="section-line" />
        <h2 class="section-title">參與人員</h2>
        <div class="field full open-meeting-option">
          <label class="choice-option open-meeting-checkbox">
            <input id="allowUnlistedParticipants" type="checkbox" />
            開放非名單人員加入
          </label>
          <p class="section-help">
            開啟後，名單外的院內人員與訪客也能掃描 QR Code
            簽到；此類會議不計算出席率，也不可代簽。未開啟時，只有參與名單內的人可以簽到。
          </p>
        </div>
        <p class="section-help">
          可以選擇單位後勾選多位人員，或直接搜尋姓名、員工編號。主持人會由系統自動加入。
        </p>
        <div class="participant-picker participant-picker-multi">
          <div class="field">
            <label for="participantDept">單位</label>
            <input
              id="participantDept"
              list="departmentOptions"
              autocomplete="off"
              placeholder="輸入單位代號或名稱搜尋"
            />
          </div>
          <div class="field">
            <label for="participantSearch">或搜尋姓名／員工編號</label>
            <input
              id="participantSearch"
              type="search"
              autocomplete="off"
              placeholder="例如：王小明、10001"
            />
          </div>
          <div class="field full participant-check-field">
            <label>人員</label>
            <div id="participantChecklist" class="participant-checklist">
              <span class="hint">請先選擇單位</span>
            </div>
          </div>
          <div class="participant-add">
            <button class="btn btn-outline" id="addParticipant" type="button">
              加入已勾選人員
            </button>
          </div>
        </div>

        <div class="selected-block selected-participant-box">
          <h3>參與名單（<span id="selectedCount">0</span>）</h3>
          <div id="selectedPeople" class="selected-people">
            <span class="hint">主持人會自動加入；其餘人員可由上方勾選。</span>
          </div>
        </div>

        <div class="field full" style="margin-top: 18px">
          <label for="meetingNote">會議說明／備註</label>
          <textarea id="meetingNote" name="note" placeholder="可填寫會議說明或注意事項"></textarea>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="submitButton" type="submit">建立會議</button>
          <a class="btn btn-light" id="cancelButton" href="dashboard.html">取消</a>
        </div>
      </form>
    </main>

    <script src="js/app.js?v=20261122"></script>
    <script src="js/time-picker.js?v=20261122"></script>
    <script src="js/create-meeting.js?v=20261122"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>會議資料</title>
    <link rel="stylesheet" href="css/app.css?v=20261122" />
    <style>
      .detail-page-title {
        margin-bottom: 18px;
      }
      .detail-page-title h1 {
        font-size: clamp(1.9rem, 3vw, 2.45rem);
        margin-bottom: 4px;
      }
      .detail-page-title p {
        font-size: 1rem;
        color: #8b817c;
      }
      .meeting-detail-panel {
        padding: 30px;
      }
      .detail-summary {
        border: 1px solid #e8dfda;
        border-radius: 16px;
        background: #fff;
        overflow: hidden;
      }
      .detail-topline {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        padding: 20px 22px;
        border-bottom: 1px solid #eee6e2;
      }
      .detail-main-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border-bottom: 1px solid #eee6e2;
      }
      .detail-main-item {
        padding: 20px 22px;
        border-right: 1px solid #f0e9e5;
      }
      .detail-main-item:last-child {
        border-right: 0;
      }
      .detail-hosts {
        padding: 20px 22px;
        border-bottom: 1px solid #eee6e2;
      }
      .detail-label {
        display: block;
        margin-bottom: 7px;
        color: #837874;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .detail-value {
        display: block;
        color: #2f2b29;
        font-size: 1.08rem;
        font-weight: 700;
        line-height: 1.5;
        word-break: break-word;
      }
      .detail-hosts .detail-value {
        font-size: 1.05rem;
      }
      .attendance-block {
        margin: 20px 22px;
        padding: 18px 20px;
        border-radius: 12px;
        background: #faf7f5;
      }
      .attendance-value {
        font-size: 2rem;
        font-weight: 800;
        color: #b51f2a;
        line-height: 1;
      }
      .attendance-unit {
        margin-left: 4px;
        color: #2f2b29;
        font-weight: 700;
      }
      .note-card {
        margin-top: 20px;
        padding: 18px 20px;
        border: 1px solid #e8dfda;
        border-radius: 14px;
        background: #fff;
      }
      .note-card .detail-value {
        font-weight: 500;
        white-space: pre-line;
      }
      .detail-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      .detail-actions-primary,
      .detail-actions-secondary {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .btn-danger-outline {
        background: #fff;
        border: 1px solid var(--red);
        color: var(--red);
      }
      .detail-actions-top {
        margin: 0 0 20px;
      }
      .detail-state-tag {
        font-size: 0.9rem;
        vertical-align: middle;
        margin-left: 8px;
      }
      .attendance-summary {
        display: flex;
        align-items: baseline;
        gap: 6px;
        flex-wrap: wrap;
        color: #2f2b29;
        font-weight: 700;
      }
      .detail-meta {
        padding: 14px 22px;
        color: #8b817c;
        font-size: 0.86rem;
      }
      .btn-danger-outline:hover {
        background: #fff3f4;
      }
      @media (max-width: 820px) {
        .meeting-detail-panel {
          padding: 20px;
        }
        .detail-topline,
        .detail-main-grid {
          grid-template-columns: 1fr;
        }
        .detail-topline {
          gap: 14px;
        }
        .detail-main-item {
          border-right: 0;
          border-bottom: 1px solid #f0e9e5;
        }
        .detail-main-item:last-child {
          border-bottom: 0;
        }
        .detail-actions {
          align-items: stretch;
        }
        .detail-actions-primary,
        .detail-actions-secondary {
          width: 100%;
        }
        .detail-actions .btn {
          flex: 1;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div id="shell"></div>
    <main class="main">
      <div class="page-title detail-page-title">
        <h1 id="title">會議資料</h1>
        <p id="sub"></p>
      </div>
      <section id="content" class="panel"></section>
    </main>

    <script src="js/app.js?v=20261122"></script>
    <script src="js/meeting-detail.js?v=20261122"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="會議簽到系統登入頁" />
  <title>會議簽到系統｜Demo Hospital</title>
  <link rel="stylesheet" href="styles.css?v=20261119-liff2" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="會議簽到系統首頁">
        <img src="assets/logo.svg" alt="示範醫院" />
      </a>
    </header>

    <main class="main-content">
      <div class="login-layout">
        <section class="hero-panel" aria-label="會議簽到系統">
          <div class="hero-overlay" aria-hidden="true"></div>
          <div class="hero-content">
            <span class="eyebrow">MEETING CHECK-IN SYSTEM</span>
            <h1>會議簽到系統</h1>
          </div>
        </section>

        <section class="form-panel">
          <div class="login-card">
            <div class="card-heading">
              <span class="section-mark" aria-hidden="true"></span>
              <div>
                <p class="kicker">STAFF SIGN IN</p>
                <h2>系統登入</h2>
              </div>
            </div>

            <p class="welcome-text">請使用院內帳號登入，進行會議簽到或簽退。</p>

            <form id="loginForm" novalidate>
              <div class="field-group">
                <label for="account">帳號</label>
                <div class="input-wrap">
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M20 21a8 8 0 0 0-16 0" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                  <input
                    id="account"
                    name="account"
                    type="text"
                    autocomplete="username"
                    placeholder="請輸入帳號"
                    aria-describedby="accountError"
                  />
                </div>
                <p class="error-message" id="accountError" role="alert"></p>
              </div>

              <div class="field-group">
                <label for="password">密碼</label>
                <div class="input-wrap">
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <rect x="4" y="10" width="16" height="11" rx="2" />
                    <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                  </svg>
                  <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="請輸入密碼"
                    aria-describedby="passwordError"
                  />
                  <span id="capsLockIcon"
                        class="caps-lock-icon"
                        title="大寫鎖定已開啟"
                        aria-label="大寫鎖定已開啟"
                        hidden>⇪</span>
                  <button class="password-toggle" id="passwordToggle" type="button" aria-label="顯示密碼" aria-pressed="false">
                    <svg class="eye-open" aria-hidden="true" viewBox="0 0 24 24">
                      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg class="eye-closed" aria-hidden="true" viewBox="0 0 24 24">
                      <path d="m3 3 18 18" />
                      <path d="M10.6 10.7a2 2 0 0 0 2.7 2.7" />
                      <path d="M9.9 4.2A10.7 10.7 0 0 1 12 4c6.5 0 10 8 10 8a15.7 15.7 0 0 1-2 3.1" />
                      <path d="M6.6 6.6C3.7 8.5 2 12 2 12s3.5 8 10 8a9.8 9.8 0 0 0 4.1-.9" />
                    </svg>
                  </button>
                </div>
<p class="error-message" id="passwordError" role="alert"></p>
              </div>

              <button class="login-button" type="submit">
                <span class="login-label">登入系統</span>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M5 12h14M13 6l6 6-6 6" />
                </svg>
              </button>

              <div class="status-message" id="statusMessage" role="status" aria-live="polite"></div>
            </form>

            <div class="support-note">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <path d="M9.8 9a2.4 2.4 0 1 1 3.6 2.1c-.9.5-1.4 1.1-1.4 2.2M12 17h.01" />
              </svg>
              <p>登入或帳號問題，請洽資訊室協助。</p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <span>示範醫院</span>
      <span class="footer-separator" aria-hidden="true">｜</span>
      <span>Portfolio demo · 資料皆為模擬</span>
    </footer>
  </div>

  <script src="script.js?v=20261119-liff2"></script>
</body>
</html>

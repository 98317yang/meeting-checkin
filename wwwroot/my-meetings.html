<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>我的會議</title>
    <link rel="stylesheet" href="css/app.css?v=20261122" />
  </head>
  <body>
    <div id="shell"></div>
    <main class="main">
      <div class="page-title">
        <h1>我的會議</h1>
        <p>我發起或主持的會議。</p>
      </div>
      <section class="panel">
        <div class="filters">
          <div class="field wide">
            <label>會議名稱</label><input id="keyword" placeholder="輸入關鍵字" />
          </div>
          <div class="field"><label>開始日期</label><input id="from" type="date" /></div>
          <div class="field"><label>結束日期</label><input id="to" type="date" /></div>
          <button class="btn btn-primary" id="search">查詢</button>
        </div>
      </section>
      <div id="list" class="meeting-list"></div>
      <div class="pagination" id="pagination"></div>
    </main>
    <script src="js/app.js?v=20261122"></script>
    <script src="js/my-meetings.js?v=20261122"></script>
  </body>
</html>

<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日會議｜會議簽到系統</title><link rel="stylesheet" href="app.css?v=20261118-ui1"></head><body><div id="shell"></div><main class="main"><div class="page-title"><h1>今日會議</h1><p>今日會議依權限提供 QR Code 或會議資訊。</p></div><div id="list"></div></main><script src="app.js?v=20261118-ui1"></script><script>
initShell();
function meetingSection(title,items,emptyText){return `<section class="today-section"><h2>${title}</h2><div class="meeting-list">${items.length?items.map(m=>meetingCard(m)).join(''):`<div class="panel today-empty">${emptyText}</div>`}</div></section>`}
(async()=>{try{const today=localDateString(),q=new URLSearchParams({userId:currentUserID(),startDate:today,endDate:today});const data=await apiJson('api/meetings?'+q);const groups={open:[],pending:[],closed:[]};data.sort((a,b)=>String(a.start).localeCompare(String(b.start))).forEach(m=>groups[meetingAccessState(m)].push(m));list.innerHTML=data.length?[['進行中',groups.open],['稍後開始',groups.pending],['已結束',groups.closed]].filter(([,items])=>items.length).map(([t,items])=>meetingSection(t,items,'')).join(''):`<div class="panel empty-state"><p>今天沒有您主持的會議。</p><a class="btn btn-primary" href="create-meeting.html">發起會議</a></div>`}catch(e){list.innerHTML=`<div class="panel">${esc(e.message)}</div>`}})();
</script></body></html>

<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>會議 QR Code</title>
    <link rel="stylesheet" href="css/app.css?v=20261122" />
    <style>
      .notice-muted {
        background: #f1efed;
        color: #625c58;
      }
    </style>
  </head>
  <body>
    <div id="shell"></div>
    <main class="main">
      <div class="page-title">
        <h1 id="title">會議 QR Code</h1>
        <p>請使用 LINE 掃描 QR Code，依手機畫面完成簽到或簽退。</p>
      </div>
      <div class="qr-layout">
        <section class="panel qr-card">
          <div class="qr-box" id="qr"><img id="qrImage" alt="會議簽到 QR Code" /></div>
          <div class="notice" id="qrNotice">請使用 LINE 掃描 QR Code 完成簽到／簽退</div>
        </section>
        <section class="panel">
          <h2>會議資訊</h2>
          <div id="info"></div>
          <div class="stats">
            <div class="stat"><span>目前簽到</span><strong id="signedInCount">0</strong></div>
            <div class="stat"><span>已簽退</span><strong id="signedOutCount">0</strong></div>
            <div class="stat" id="expectedStat">
              <span>應到人數</span><strong id="expectedCount">0</strong>
            </div>
          </div>
          <div class="actions">
            <a id="listBtn" class="btn btn-primary" style="display: none">查看簽到名單</a>
            <button class="btn btn-outline" id="regenerateBtn" type="button" hidden>
              重新產生 QR Code
            </button>
            <a class="btn btn-light" id="backBtn" href="sign-in.html">返回今日會議</a>
          </div>
        </section>
      </div>
    </main>

    <script src="js/app.js?v=20261122"></script>
    <script src="js/qr.js?v=20261122"></script>
  </body>
</html>

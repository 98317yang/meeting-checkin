<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#b51f2a" />
    <title>會議入口｜會議簽到系統</title>
    <link rel="stylesheet" href="css/app.css?v=20261122" />
    <style>
      .mobile-section {
        padding: 26px 22px;
      }
      .mobile-section h1 {
        margin: 0 0 10px;
        font-size: 1.25rem;
      }
      .mobile-section > p {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.7;
      }
      .bind-form {
        display: grid;
        gap: 14px;
        margin-top: 18px;
      }
      .bind-form label {
        display: grid;
        gap: 6px;
        font-weight: 700;
        font-size: 0.92rem;
      }
      .bind-form input {
        padding: 12px 13px;
        border: 1px solid #ddd3cd;
        border-radius: 11px;
        font-size: 1rem;
      }
      .bind-actions {
        display: grid;
        gap: 10px;
        margin-top: 4px;
      }
      .bind-note {
        margin: 14px 0 0;
        color: #8b817c;
        font-size: 0.86rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body class="mobile-page">
    <main class="mobile-shell compact-mobile-shell">
      <header class="mobile-topbar">
        <img src="assets/logo.svg" alt="示範醫院" />
        <span>會議簽到系統</span>
      </header>
      <section id="liffContent" aria-live="polite">
        <div class="mobile-loading">正在確認 LINE 身分…</div>
      </section>
    </main>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="js/liff-entry.js?v=20261122"></script>
  </body>
</html>

# Local SQL Server with the mock databases.
#
#   1. cp .env.example .env   and set MSSQL_SA_PASSWORD / APP_DB_PASSWORD
#   2. docker compose up -d
#   3. docker compose logs db-init     (should end with "Database ready.")
#
# Apple Silicon: SQL Server only ships amd64 images. Enable
# Docker Desktop > Settings > General > "Use Rosetta for x86_64/amd64 emulation".

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: meeting-checkin-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      TZ: Asia/Taipei
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Runs once: creates the databases, tables, procedures, app login and demo data.
  # Both scripts are idempotent, so `docker compose up` again is safe.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd -C -I -S db -U sa -P "$$MSSQL_SA_PASSWORD" -b
        -v APP_DB_PASSWORD="$$APP_DB_PASSWORD"
        -i /db/01-schema.sql -i /db/02-seed.sql
        && echo "Database ready."
    restart: "no"

volumes:
  mssql-data:
